version: 1
frontend:
  phases:
    preBuild:
      commands:
        # La imagen de build de Amplify no trae pnpm. Corepack lo instala en la
        # version exacta que declara `packageManager` en package.json, para que
        # el lockfile v9 se resuelva igual que en local.
        - nvm install 22
        - nvm use 22
        - corepack enable
        - corepack prepare --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Amplify inyecta las variables del panel solo en el contenedor de
        # build. La funcion SSR no las hereda, y Payload muere en cada peticion
        # con "missing secret key": la portada se veia por estar prerenderizada,
        # pero /noticias, /[slug] y /api/media/file/* devolvian 500.
        # Escribirlas en .env.production hace que Next las cargue tambien al
        # servir. Se listan una por una a proposito: `env` completo volcaria al
        # artefacto de despliegue variables del build que no pintan nada ahi.
        #
        # Las obligatorias se comprueban ANTES, y no es ceremonia: `grep` sale
        # con codigo 1 cuando no encuentra nada, y Amplify aborta el build ahi
        # mismo con «Command failed with exit code 1» y ni una pista.
        #
        # Aqui NO ha pasado, y por eso es facil de pasar por alto: con las
        # variables puestas en el panel el grep siempre casa algo y la trampa
        # no se dispara nunca. Se disparo en el clon de San Pedro de la Paz, en
        # su primer despliegue, con el panel todavia vacio: el log moria en
        # esta linea sin nombrar una sola variable. Cualquier entorno nuevo de
        # este portal -otra rama, otra cuenta- llegaria igual de ciego.
        - |
          faltan=""
          [ -n "$DATABASE_URL" ]   || faltan="$faltan DATABASE_URL"
          [ -n "$PAYLOAD_SECRET" ] || faltan="$faltan PAYLOAD_SECRET"
          # Sin esta, `URL_DEL_SITIO` cae a http://localhost:3000 dentro de la
          # funcion SSR. No tumba nada -por eso paso desapercibido- pero deja
          # la vista previa en vivo del panel apuntando al equipo del editor, y
          # el sitemap y las imagenes de compartir en redes con URLs a
          # localhost. Se ve recien cuando alguien comparte una noticia.
          [ -n "$NEXT_PUBLIC_SERVER_URL" ] || faltan="$faltan NEXT_PUBLIC_SERVER_URL"
          # S3_BUCKET es opcional en un servidor propio y obligatorio aca: el
          # disco de la funcion SSR es de solo lectura y efimero, asi que sin
          # bucket cada foto que suba el equipo de comunicaciones desaparece al
          # reciclarse el contenedor. Sin error en el panel, sin nada en los
          # logs: la imagen simplemente ya no esta, y el documento la sigue
          # referenciando. Es la unica perdida de datos silenciosa que queda en
          # el despliegue, y por eso el build se detiene.
          # Para desplegar a proposito sin bucket -una rama de prueba donde no
          # importa perder las subidas- se define PERMITIR_DISCO_LOCAL=true.
          if [ -z "$S3_BUCKET" ] && [ "$PERMITIR_DISCO_LOCAL" != "true" ]; then
            faltan="$faltan S3_BUCKET"
          fi
          if [ -n "$faltan" ]; then
            echo "Faltan variables de entorno en el panel de Amplify:$faltan" >&2
            echo "Se definen en App settings > Environment variables." >&2
            echo "Si la falta es S3_BUCKET y de verdad no quieres conservar las" >&2
            echo "imagenes subidas, define PERMITIR_DISCO_LOCAL=true." >&2
            exit 1
          fi
        # `|| true` porque quedan opcionales de verdad (S3_REGION, CRON_SECRET,
        # NEXT_PUBLIC_URL_PLATAFORMA) y que falten no es un error.
        - env | grep -E '^(DATABASE_URL|PAYLOAD_SECRET|S3_BUCKET|S3_REGION|CRON_SECRET|NEXT_PUBLIC_SERVER_URL|NEXT_PUBLIC_URL_PLATAFORMA)=' >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
